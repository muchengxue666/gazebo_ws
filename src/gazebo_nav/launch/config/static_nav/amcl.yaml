odom_model_type: omni
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05
odom_alpha5: 0.05

odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
tf_broadcast: true
transform_tolerance: 0.2

use_map_topic: false
first_map_only: true

min_particles: 500
max_particles: 3000
kld_err: 0.03
kld_z: 0.99
resample_interval: 1

laser_model_type: likelihood_field
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_rand: 0.05
laser_sigma_hit: 0.1
laser_likelihood_max_dist: 1.0

update_min_d: 0.05
update_min_a: 0.10
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
initial_cov_xx: 0.01
initial_cov_yy: 0.01
initial_cov_aa: 0.03
