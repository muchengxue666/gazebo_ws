# External command topic. The robot waits at its spawn pose until one valid
# std_msgs/String category is received.
cube_category_topic: /cube_category
arm_poses_verified: false

category_to_model:
  food: cube_0
  daily: cube_1
  electronics: cube_2

# These are search-area priors from spawn_cubes.py, not fixed cube poses or
# fixed grasp stations. The detected map Pose is the grasp target.
search_areas:
  area_a: {x_min: -2.10, x_max: -1.92, y_min: -0.61, y_max: -0.28}
  area_b: {x_min: -1.56, x_max: -1.23, y_min: -0.01, y_max: 0.17}
  area_c: {x_min: -0.95, x_max: -0.77, y_min: -0.69, y_max: -0.36}

parking_areas:
  food: {x_min: 0.75, x_max: 1.25, y_min: -3.23, y_max: -2.73}
  daily: {x_min: 0.75, x_max: 1.25, y_min: -1.75, y_max: -1.25}
  electronics: {x_min: 2.30, x_max: 2.80, y_min: -2.47, y_max: -1.97}

map_bounds:
  x_min: -2.4696
  x_max: 3.096
  y_min: -3.5001
  y_max: 0.517

# Existing values are starting poses only. Set arm_poses_verified true only
# after checking these poses and the derived tcp_link geometry in Gazebo.
# The base must be stationary while observe/grasp/place poses are active.
arm_poses:
  # Must stay clear of the horizontal laser scan plane during navigation.
  navigation:
    positions: [0.0, 1.6, -2.2, -1.0, 0.0]
    duration: 3.0
  # Captured from the verified search-camera snapshot.
  observe:
    positions: [1.570006, 0.765642, 0.815474, 0.941225, 0.000000]
    duration: 3.0
  # Retract and raise the camera for the closer fixed-area waypoints. The
  # camera looks down near 0.37 m in front of the base, then arm_joint1 pans
  # cover the left and right edges of each source region.
  area_observe:
    positions: [1.570006, 0.100000, 1.250000, 1.400000, 0.000000]
    duration: 3.0
  # Keep the TCP behind and about 11 cm above the final grasp point before
  # descending. This avoids sweeping the arm through a nearby wall.
  grasp_approach:
    positions: [0.000000, 1.570820, -0.910000, 2.580000, 0.000000]
    duration: 3.0
  grasp:
    positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.000000]
    duration: 3.0
  # Keep the object attached in this raised posture while navigating.
  transport:
    positions: [0.0, 1.6, -2.2, -1.0, 0.0]
    duration: 3.0
  place:
    positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.000000]
    duration: 3.0

gripper_open: 1.5
gripper_close: 0.8
min_confidence: 0.38
max_pose_age: 0.8
detection_timeout: 12.0
arm_timeout: 8.0
nav_timeout: 45.0
server_wait_timeout: 60.0
navigation_ready_timeout: 60.0
navigation_stable_time: 3.0
navigation_pose_tolerance: 0.03
navigation_data_timeout: 2.5
navigation_min_costmap_updates: 3
attach_timeout: 5.0
# A failed conservative-box check happens before the gripper closes, so it is
# safe to reacquire/re-align a bounded number of times instead of exiting.
grasp_prepare_retries: 2
grasp_retry_max_target_shift: 0.12
# After any failed attempt that already located the target, keep the current
# category and repeatedly search around the stopped failure pose. The node
# does not return home or wait for another /cube_category command.
failure_search_retry_delay: 1.0
# Bounded offsets (metres, map frame) searched around the live failure pose.
# The object coordinates remain entirely vision/TF-derived.
failure_search_offsets: [[0.0, 0.0], [0.12, 0.0], [-0.12, 0.0],
                         [0.0, 0.12], [0.0, -0.12]]
nav_retries: 1
# Normally navigate directly from the search pose to the estimated grasp pose.
# Keep one additional coarse correction only when the fresh observation still
# lies outside the bounded 8 cm /cmd_vel fine-alignment region.
max_align_iterations: 2
max_align_step: 1.0
align_xy_tolerance: 0.012
# Last 8 cm use bounded low-speed /cmd_vel feedback; move_base handles the
# preceding coarse alignment.
fine_align_distance: 0.08
fine_align_timeout: 10.0
fine_align_rate: 20.0
fine_align_max_linear_speed: 0.04
fine_align_max_angular_speed: 0.30
fine_align_linear_gain: 0.8
fine_align_angular_gain: 0.8
fine_align_yaw_tolerance: 0.04
align_z_tolerance: 0.015
align_fresh_pose_samples: 3
align_fresh_pose_timeout: 3.0
align_fresh_pose_max_span: 0.02
align_settle_time: 0.5
# Match grasp_attach's immutable 20 mm per-axis readiness box.
max_grasp_offset: 0.020
vision_reset_service: /cube_vision/reset
# spawn_cubes ranges are expressed in Gazebo world, while detections are in
# AMCL map; allow the observed map/world localization offset in simulation.
search_area_match_margin: 0.10
# First try one broad rotating search from the verified camera pose.
coarse_search_pose: {x: -1.40, y: -0.4311, yaw: 1.7201}
# If the broad search misses, visit A, B, and C in order before any standoff
# retry. At each base waypoint the arm scans center, left, and right views.
area_search_waypoints:
  # Each waypoint is about 0.45 m outside its configured region center.
  - {area: area_a, x: -1.56, y: -0.445, yaw: 3.1415927}
  - {area: area_b, x: -1.395, y: -0.37, yaw: 1.5707963}
  - {area: area_c, x: -1.31, y: -0.525, yaw: 0.0}
area_search_timeout: 6.0
# Face each known source area with the vehicle first; arm_joint1 then handles
# only the small center/edge camera views around that area.
area_search_pan_offsets: [0.45, -0.45]
area_search_pan_timeout: 4.0
# Fixed areas use the verified far observation first. If that view misses,
# retract the camera into the near observation pose and scan both edges with
# arm_joint1; the base remains parked at the known area waypoint.
area_search_view_stages:
  - {pose: observe, pan_offsets: []}
  - {pose: area_observe, pan_offsets: [0.45, -0.45]}
# Let Gazebo camera queues drain after each arm pan before resetting votes.
area_search_view_settle_time: 0.8
# Only after center and pan views miss, back away from the area's center and
# repeat the views once. This handles near-edge cubes without slowing normal
# searches or hard-coding any random cube coordinate.
area_search_standoff_distance: 0.18
# The normal direct transition already closes position and yaw together. The
# fallback threshold remains for a move_base transition or a fast-path view.
area_search_reorient_yaw_threshold: 2.50
# Pass 1 is the direct nominal A/B/C sweep. Pass 2 repeats the sweep with the
# existing per-area 0.18 m standoff fallback enabled.
area_search_passes: 2
# Optional experiment: scan the three regions from the coarse search pose
# before the normal search. Random B/C trials were slower than the complete
# base rotation, so the production path keeps rotation first.
fast_area_search: false
# spawn_cubes places exactly one cube in each source region. Once a center view
# independently confirms a non-target, no pan view can contain the requested
# category, so the fast path may continue directly to the next region.
fast_area_stop_on_non_target: true
# A target candidate must survive independent vote resets at the same pose.
search_target_confirmations: 2
search_target_confirm_timeout: 4.0
search_target_confirm_distance: 0.05
# The coarse direct rotation bypasses move_base collision checking because
# the lowered observe arm blocks raw /scan.
search_settle_time: 0.5
search_rotation_speed: -0.25
search_rotation_angle: 6.283185
search_rotation_timeout: 40.0
search_rotation_rate: 20.0
search_rotation_max_drift: 0.08
# If rotation sees a cube near an image edge, use its visual map pose and the
# live camera TF to rotate in place until it is near image center.
coarse_center_enabled: true
coarse_center_camera_frame: camera_depth_optical_frame
coarse_center_tolerance: 0.08
coarse_center_max_angle: 0.65
coarse_center_timeout: 2.5
coarse_center_gain: 1.5
coarse_center_max_speed: 0.30
# Once coarse navigation reaches the obstacle-free search zone, use bounded
# map-TF feedback instead of invoking move_base for these short transitions.
search_direct_max_distance: 0.30
search_direct_timeout: 10.0
search_direct_max_linear_speed: 0.15
search_direct_max_angular_speed: 0.50
# Spatial tolerance used to avoid stopping repeatedly on one non-target cube.
search_detection_dedupe_distance: 0.05
# The vehicle, not the cube, must fit completely inside the marked workshop.
parking_footprint: [[0.190, -0.060], [0.145, -0.131],
                    [-0.145, -0.131], [-0.164, -0.066],
                    [-0.164, 0.066], [-0.145, 0.131],
                    [0.145, 0.131], [0.190, 0.060]]
parking_footprint_margin: 0.01
parking_position_tolerance: 0.015
parking_yaw_tolerance: 0.04
parking_timeout: 10.0
joint_tolerance: 0.03
goal_time_tolerance: 1.5
# Gazebo joint-state samples show ~0.0024 rad controller quantization near
# the target; use a tolerance above that noise floor for settling.
settle_position_delta: 0.01
settle_timeout: 2.0
settle_samples: 5
