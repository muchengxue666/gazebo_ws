# Independent first-stage task configuration.
# Navigation remains the validated static_nav_sim chain.
target_category: food
start_task: false
arm_poses_verified: false

category_to_model:
  food: cube_0
  daily: cube_1
  electronics: cube_2

# These are search-area priors from spawn_cubes.py, not fixed cube poses or
# fixed grasp stations. The detected map Pose is the grasp target.
search_areas:
  area_a: {x_min: -2.10, x_max: -1.92, y_min: -0.61, y_max: -0.28}
  area_b: {x_min: -1.56, x_max: -1.23, y_min: -0.01, y_max: 0.17}
  area_c: {x_min: -0.95, x_max: -0.77, y_min: -0.69, y_max: -0.36}

drop_areas:
  food: {x_min: 0.75, x_max: 1.25, y_min: -3.23, y_max: -2.73}
  electronics: {x_min: 2.30, x_max: 2.80, y_min: -2.47, y_max: -1.97}
  # daily is intentionally omitted until its map coordinates are verified.

map_bounds:
  x_min: -2.4696
  x_max: 3.096
  y_min: -3.5001
  y_max: 0.517

# Existing values are starting poses only. Set arm_poses_verified true only
# after checking these poses and the derived tcp_link geometry in Gazebo.
# The base must be stationary while observe/grasp/place poses are active.
arm_poses:
  # Must stay clear of the horizontal laser scan plane during navigation.
  navigation:
    positions: [0.0, 1.6, -2.2, -1.0, 0.0]
    duration: 3.0
  # Captured from the verified search-camera snapshot.
  observe:
    positions: [1.570006, 0.765642, 0.815474, 0.941225, 0.000000]
    duration: 3.0
  grasp:
    positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.000000]
    duration: 3.0
  # Keep the object attached in this raised posture while navigating.
  transport:
    positions: [0.0, 1.6, -2.2, -1.0, 0.0]
    duration: 3.0
  place:
    positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.000000]
    duration: 3.0

gripper_open: 1.5
gripper_close: 0.8
min_confidence: 0.38
max_pose_age: 0.8
detection_timeout: 12.0
arm_timeout: 8.0
nav_timeout: 45.0
server_wait_timeout: 60.0
navigation_ready_timeout: 60.0
navigation_startup_delay: 10.0
navigation_stable_time: 3.0
navigation_pose_tolerance: 0.03
navigation_data_timeout: 2.5
navigation_min_costmap_updates: 3
attach_timeout: 5.0
release_timeout: 5.0
nav_retries: 1
max_align_iterations: 2
max_align_step: 0.15
align_xy_tolerance: 0.012
# Last 8 cm use bounded low-speed /cmd_vel feedback; move_base handles the
# preceding coarse alignment.
fine_align_distance: 0.08
fine_align_timeout: 10.0
fine_align_rate: 20.0
fine_align_max_linear_speed: 0.04
fine_align_max_angular_speed: 0.30
fine_align_linear_gain: 0.8
fine_align_angular_gain: 0.8
fine_align_yaw_tolerance: 0.04
align_z_tolerance: 0.015
align_fresh_pose_samples: 3
align_fresh_pose_timeout: 3.0
align_fresh_pose_max_span: 0.02
align_settle_time: 0.5
max_grasp_offset: 0.015
vision_reset_service: /cube_vision/reset
# spawn_cubes ranges are expressed in Gazebo world, while detections are in
# AMCL map; allow the observed map/world localization offset in simulation.
search_area_match_margin: 0.10
# Fixed map pose captured from the successful search-camera setup.
search_pose: {x: -1.40, y: -0.4311, yaw: 1.7201}
# Search in order. The first waypoint is the verified pose; the latter two
# are conservative area-B/area-C candidates and must remain navigation-arm
# poses until their camera coverage is confirmed.
search_waypoints:
  - {x: -1.40, y: -0.4311, yaw: 1.7201}
  - {x: -1.40, y: -0.20, yaw: 1.5708}
  - {x: -1.20, y: -0.53, yaw: 0.0}
# Experimental direct rotation while observe is active. This bypasses
# move_base collision checking because the lowered arm blocks raw /scan.
search_settle_time: 0.5
search_rotation_speed: -0.20
search_rotation_angle: 6.283185
search_rotation_timeout: 40.0
search_rotation_rate: 20.0
search_rotation_max_drift: 0.08
# Spatial tolerance used to avoid stopping repeatedly on one non-target cube.
search_detection_dedupe_distance: 0.05
drop_margin: 0.05
drop_settle_samples: 5
drop_settle_delta: 0.01
joint_tolerance: 0.03
goal_time_tolerance: 1.5
# Gazebo joint-state samples show ~0.0024 rad controller quantization near
# the target; use a tolerance above that noise floor for settling.
settle_position_delta: 0.01
settle_timeout: 2.0
settle_samples: 5
