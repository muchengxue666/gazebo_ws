output_frame: map
camera_info_topic: /camera/rgb/camera_info
processing_rate: 5.0
min_depth: 0.03
max_depth: 1.0
min_face_pixels: 14
max_face_pixels: 320
min_quad_area: 260.0
min_face_size: 0.025
max_face_size: 0.12
template_score_threshold: 0.38
template_score_margin: 0.04
surface_to_center_depth: 0.02
stability_samples: 5
required_votes: 3
max_position_std: 0.025
publish_debug_image: true
depth_debug_max: 4.0
rgb_pose_fallback: true
rgb_cube_size: 0.04
rgb_pose_min_depth: 0.05
rgb_pose_max_depth: 0.8

# These are search priors copied from the immutable spawn script.
search_areas:
  area_a: {x_min: -2.10, x_max: -1.92, y_min: -0.61, y_max: -0.28}
  area_b: {x_min: -1.56, x_max: -1.23, y_min: -0.01, y_max: 0.17}
  area_c: {x_min: -0.95, x_max: -0.77, y_min: -0.69, y_max: -0.36}

drop_areas:
  electronics: {x_min: 2.30, x_max: 2.80, y_min: -2.47, y_max: -1.97}
  food: {x_min: 0.75, x_max: 1.25, y_min: -3.23, y_max: -2.73}

