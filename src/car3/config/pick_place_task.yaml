output_frame: map
camera_info_topic: /camera/rgb/camera_info
processing_rate: 5.0
min_depth: 0.03
max_depth: 1.0
# Bright connected-component cube detector. It accepts multi-face silhouettes
# and edge-truncated views instead of requiring a complete quadrilateral.
brightness_threshold: 80
brightness_offset: 20
brightness_blur: 0
min_candidate_area: 300.0
# Allow a close cube to occupy a larger connected component before the
# texture/category checks reject it.
max_candidate_area: 30000.0
min_candidate_pixels: 20
max_candidate_pixels: 300
max_candidate_aspect: 2.5
min_candidate_fill: 0.45
min_candidate_solidity: 0.82
min_dark_fraction: 0.04
dark_pixel_offset: 18
roi_padding: 4
# Depth geometry uses registered RGB/depth pixels and fits the visible face
# before moving from the surface to the cube center.
cube_half_size: 0.02
depth_plane_min_points: 30
depth_plane_max_residual: 0.004
# Gazebo's depth sensor has <pose>0 0 0 pi 0 0</pose>, but TF publishes the
# URDF optical frame without that sensor-local roll.
sensor_to_optical_rpy: [3.141592653589793, 0.0, 0.0]
# Category matching uses the distinctive top text and RANSAC-consistent SIFT
# matches; the shared "物块" text is excluded from the templates.
feature_scale: 3.0
feature_ratio: 0.74
feature_ransac_threshold: 7.0
min_feature_matches: 4
min_feature_inliers: 4
min_template_coverage: 0.008
min_roi_coverage: 0.004
min_category_margin: 0.45
template_category_fraction: 0.55
# At 5 Hz, retain valid category/pose votes across about one second of
# intermittent corner-view or post-motion dropouts.
max_unknown_frames: 5
stability_samples: 5
required_votes: 3
max_position_std: 0.025
publish_debug_image: true
depth_debug_max: 4.0
# RGB size fallback is retained for diagnostics but is not a reliable grasp pose.
rgb_pose_fallback: false
rgb_cube_size: 0.04
rgb_pose_min_depth: 0.05
rgb_pose_max_depth: 0.8

# These are search priors copied from the immutable spawn script.
search_areas:
  area_a: {x_min: -2.10, x_max: -1.92, y_min: -0.61, y_max: -0.28}
  area_b: {x_min: -1.56, x_max: -1.23, y_min: -0.01, y_max: 0.17}
  area_c: {x_min: -0.95, x_max: -0.77, y_min: -0.69, y_max: -0.36}

drop_areas:
  electronics: {x_min: 2.30, x_max: 2.80, y_min: -2.47, y_max: -1.97}
  food: {x_min: 0.75, x_max: 1.25, y_min: -3.23, y_max: -2.73}

# Navigation observation poses and arm trajectories must be measured in Gazebo.
# The task executor must reject startup while calibrated remains false.
calibration:
  calibrated: false
  observation_poses: {}
  arm_poses:
    observe:
      positions: [0.001026, 1.005277, 0.753804, 1.381747, 0.188403]
      duration: 3.0
    grasp:
      positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.004899]
      duration: 3.0
  gripper_open: 1.5
  gripper_close: 0.8
  grasp_alignment:
    base_map_reference:
      x: -1.068817
      y: -0.349280
      yaw: -0.020994
    desired_cube_in_base:
      x: 0.000305
      y: -0.001024
      z: 0.005995
    ready_offset_before_close:
      x: 0.010401
      y: -0.005301
      z: 0.004844
