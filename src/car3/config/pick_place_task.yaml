  calibrated: false
  observation_poses: {}
  arm_poses:
    observe:
      positions: [0.001026, 1.005277, 0.753804, 1.381747, 0.188403]
      duration: 3.0
    grasp:
      positions: [0.000288, 1.570820, 0.126232, 1.570326, 0.004899]
      duration: 3.0
  gripper_open: 1.5
  gripper_close: 0.8
  grasp_alignment:
    base_map_reference:
      x: -1.068817
      y: -0.349280
      yaw: -0.020994
    desired_cube_in_base:
      x: 0.000305
      y: -0.001024
      z: 0.005995
    ready_offset_before_close:
      x: 0.010401
      y: -0.005301
